<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <style>
        .invalid {
            color: red;
        }

        .valid {
            color: green;
        }
    </style>
</head>
<body>

    <h1>Sign Up</h1>

    <form id="signupForm">
        <label for="name">Name</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Create a password" required>

        <!-- Password rules: hidden at first-->
        <ul id="rules" hidden>
            <li id="ruleLength" class="invalid">At least 6 characters</li>
            <li id="ruleSpecial" class="invalid">Must include a special character (!@#$...)</li>
            <li id="ruleUpper" class="invalid">Must include an uppercase letter (A-Z)</li>
        </ul>

        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.getElementById('signupForm');
        const password = document.getElementById('password');
        const rules = document.getElementById('rules');
        const ruleLength = document.getElementById('ruleLength');
        const ruleSpecial = document.getElementById('ruleSpecial');
        const ruleUpper = document.getElementById('ruleUpper');

        // Step 2A: submit event
        form.addEventListener('submit', (event) => {
            event.preventDefault();
            window.location.href = "success.html";
        });

        // Step 2B and Step 3: check the password rules as the user types
        password.addEventListener('input', () => {
            const value = password.value;

            rules.hidden = false;   // show the rules once the user starts typing

            const hasLength = value.length >= 6;
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(value);
            const hasUpper = /[A-Z]/.test(value);

            ruleLength.classList.toggle('valid', hasLength);
            ruleLength.classList.toggle('invalid', !hasLength);

            ruleSpecial.classList.toggle('valid', hasSpecial);
            ruleSpecial.classList.toggle('invalid', !hasSpecial);

            ruleUpper.classList.toggle('valid', hasUpper);
            ruleUpper.classList.toggle('invalid', !hasUpper);
        });
    </script>
</body>
</html>
