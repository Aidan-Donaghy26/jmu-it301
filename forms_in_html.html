<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Practice</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>
        IT301 Labs and Projects
    </h1>
    <form>
        <label for="username">  Name:</label>
        <input id="username" type="text" name="username" placeholder="Enter your name">
        <button type="submit">Send</button>
    </form>
    <fieldset>
        <legend>Preferred contact method</legend>
        <input type="radio" id="c1" name="contact"> <label for="c1">Email</label>
        <input type="radio" id="c2" name="contact"> <label for="c2">Phone</label>
    </fieldset>
</body>
</html>
